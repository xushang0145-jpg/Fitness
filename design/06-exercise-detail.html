<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 · 动作详情</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen">
  <div class="notch"></div>
  <div class="scroll">
    <div style="position:relative;height:280px;flex-shrink:0">
      <img class="demo-img" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=athletic%20asian%20man%20performing%20dumbbell%20lateral%20raise%20exercise%2C%20perfect%20form%2C%20side%20profile%20view%2C%20dark%20modern%20gym%20background%2C%20realistic%20professional%20fitness%20photography%2C%20muscular%20shoulders%2C%20dramatic%20cinematic%20lighting&image_size=portrait_4_3" alt="">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,15,18,.45) 0%,transparent 30%,transparent 55%,var(--bg) 100%)"></div>
      <div class="statusbar" style="position:absolute;top:0;left:0;right:0"><span>9:41</span>
        <span style="display:flex;gap:6px;align-items:center">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="white"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke="white" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="white"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="white" opacity=".4"/></svg>
        </span>
      </div>
      <div style="position:absolute;top:64px;left:20px;right:20px;display:flex;justify-content:space-between">
        <div style="width:36px;height:36px;border-radius:12px;background:rgba(24,28,34,.7);backdrop-filter:blur(10px);border:1px solid var(--border);display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F4F6" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div style="width:36px;height:36px;border-radius:12px;background:rgba(24,28,34,.7);backdrop-filter:blur(10px);border:1px solid var(--border);display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F4F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </div>
      </div>
    </div>

    <div style="padding:0 20px;margin-top:-20px;position:relative">
      <div class="row" style="gap:8px">
        <span class="pill-tag" style="background:rgba(91,200,245,.14);color:var(--blue)">肩部 · 中束</span>
        <span class="pill-tag" style="background:var(--card-2);color:var(--txt-2);border:1px solid var(--border)">哑铃</span>
        <span class="pill-tag" style="background:var(--card-2);color:var(--txt-2);border:1px solid var(--border)">中级</span>
      </div>
      <div class="page-title" style="font-size:26px;margin-top:10px">哑铃侧平举</div>
      <div class="caption" style="margin-top:4px;font-size:12px">Dumbbell Lateral Raise</div>

      <div class="row" style="gap:10px;margin-top:16px">
        <div class="card" style="flex:1;padding:12px;text-align:center">
          <div class="num" style="font-size:18px">4</div>
          <div class="label" style="margin-top:2px">组数</div>
        </div>
        <div class="card" style="flex:1;padding:12px;text-align:center">
          <div class="num" style="font-size:18px">12</div>
          <div class="label" style="margin-top:2px">每组次数</div>
        </div>
        <div class="card" style="flex:1;padding:12px;text-align:center">
          <div class="num" style="font-size:18px">60s</div>
          <div class="label" style="margin-top:2px">组间休息</div>
        </div>
      </div>

      <div class="section-title" style="margin-top:22px">动作要领</div>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
        <div class="row" style="gap:12px;align-items:flex-start">
          <div style="width:24px;height:24px;border-radius:8px;background:var(--acc-soft);color:var(--acc);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">1</div>
          <div class="caption" style="font-size:13px;line-height:1.55;color:var(--txt)">双脚与肩同宽站立，双手各握哑铃置于体侧，掌心相对</div>
        </div>
        <div class="row" style="gap:12px;align-items:flex-start">
          <div style="width:24px;height:24px;border-radius:8px;background:var(--acc-soft);color:var(--acc);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">2</div>
          <div class="caption" style="font-size:13px;line-height:1.55;color:var(--txt)">微屈手肘，用肩部力量将哑铃向两侧抬起至与肩同高</div>
        </div>
        <div class="row" style="gap:12px;align-items:flex-start">
          <div style="width:24px;height:24px;border-radius:8px;background:var(--acc-soft);color:var(--acc);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">3</div>
          <div class="caption" style="font-size:13px;line-height:1.55;color:var(--txt)">顶点停顿 1 秒，感受三角肌收缩，缓慢下放还原</div>
        </div>
      </div>

      <div class="card" style="margin-top:18px;padding:14px 16px;background:rgba(255,138,91,.07);border-color:rgba(255,138,91,.25)">
        <div class="row" style="gap:8px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF8A5B" stroke-width="2" stroke-linecap="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
          <span style="font-size:13px;font-weight:700;color:var(--orange)">常见错误</span>
        </div>
        <div class="caption" style="font-size:12px;margin-top:8px;line-height:1.6">不要耸肩借力，避免使用过大重量导致身体晃动；抬起高度不超过肩部，避免肩峰撞击</div>
      </div>

      <div class="btn-acc" style="height:54px;margin-top:20px;font-size:16px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#0B0D0E"><path d="M7 4l13 8-13 8z"/></svg>
        开始跟练
      </div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
</body>
</html>
