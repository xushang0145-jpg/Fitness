<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 · 课程进行中</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen">
  <div class="notch"></div>
  <div class="scroll">
    <div class="statusbar"><span>9:41</span>
      <span style="display:flex;gap:6px;align-items:center">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="white"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke="white" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="white"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="white" opacity=".4"/></svg>
      </span>
    </div>

    <div style="padding:4px 20px 0;overflow:hidden">
      <div class="row" style="justify-content:space-between">
        <div style="width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F4F6" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </div>
        <div class="label">燃脂全身 · 第 1 / 8 个动作</div>
        <div style="width:36px"></div>
      </div>

      <div class="card" style="margin-top:14px;padding:0;overflow:hidden;position:relative;height:230px">
        <img class="demo-img" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=athletic%20person%20doing%20jumping%20jacks%20exercise%2C%20arms%20and%20legs%20spread%2C%20dark%20gym%2C%20realistic%20fitness%20photography%2C%20dramatic%20rim%20lighting&image_size=landscape_4_3" alt="">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(13,15,18,.85) 100%)"></div>
        <div style="position:absolute;left:16px;bottom:14px;right:16px">
          <div style="font-size:19px;font-weight:800">开合跳</div>
          <div class="caption" style="font-size:12px;margin-top:2px">双脚并拢跳起，双手经两侧头顶击掌</div>
        </div>
        <div class="pill-tag" style="position:absolute;top:12px;right:12px;background:rgba(24,28,34,.8);backdrop-filter:blur(8px);color:var(--txt-2)">示意图</div>
      </div>

      <div style="display:flex;justify-content:center;margin-top:20px">
        <div style="position:relative;width:190px;height:190px">
          <svg width="190" height="190" viewBox="0 0 190 190">
            <circle class="ring-track" cx="95" cy="95" r="82" stroke-width="10"/>
            <circle cx="95" cy="95" r="82" stroke-width="10" fill="none" stroke="rgba(255,138,91,.2)" stroke-linecap="round"
              stroke-dasharray="515" stroke-dashoffset="120" transform="rotate(-90 95 95)"/>
            <circle class="ring-acc" cx="95" cy="95" r="82" stroke-width="10"
              stroke-dasharray="515" stroke-dashoffset="320" transform="rotate(-90 95 95)"/>
          </svg>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
            <div class="label">计时 · 30 秒</div>
            <div class="num" style="font-size:54px;letter-spacing:-.03em;margin-top:2px">18</div>
            <div class="caption" style="font-size:12px;color:var(--acc);margin-top:2px">保持节奏</div>
          </div>
        </div>
      </div>

      <div class="row" style="gap:10px;margin-top:18px">
        <div class="card" style="flex:1;padding:12px;display:flex;align-items:center;gap:10px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7480" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11m11-11v11M3 9v6m18-6v6M6.5 12h11"/></svg>
          <div>
            <div class="num" style="font-size:15px">1 / 1 组</div>
            <div class="label" style="margin-top:1px">当前组数</div>
          </div>
        </div>
        <div class="card" style="flex:1;padding:12px;display:flex;align-items:center;gap:10px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7480" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <div>
            <div class="num" style="font-size:15px">~14 千卡</div>
            <div class="label" style="margin-top:1px">预计消耗</div>
          </div>
        </div>
      </div>

      <div class="row" style="gap:12px;margin-top:18px">
        <div style="flex:1;height:54px;border-radius:999px;background:var(--card-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;color:var(--txt-2)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
          跳过动作
        </div>
        <div style="flex:1;height:54px;border-radius:999px;background:var(--card-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;color:var(--txt-2)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#A6AEB8"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>
          暂停
        </div>
        <div class="btn-acc" style="flex:1.3;height:54px;font-size:15px">完成本组 ✓</div>
      </div>

      <div class="caption" style="text-align:center;font-size:11px;color:var(--txt-3);margin-top:14px">下一动作：高抬腿 · 30 秒</div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
</body>
</html>
