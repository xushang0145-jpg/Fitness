<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>04 · 历史记录</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen">
  <div class="notch"></div>
  <div class="scroll">
    <div class="statusbar"><span>9:41</span>
      <span style="display:flex;gap:6px;align-items:center">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="white"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke="white" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="white"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="white" opacity=".4"/></svg>
      </span>
    </div>

    <div style="padding:8px 20px 0;overflow:hidden">
      <div class="row" style="justify-content:space-between">
        <div class="page-title" style="font-size:24px">运动记录</div>
        <div style="width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F4F6" stroke-width="2" stroke-linecap="round"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg>
        </div>
      </div>

      <div class="row" style="gap:8px;margin-top:16px">
        <div class="chip on">全部</div>
        <div class="chip">跑步</div>
        <div class="chip">骑行</div>
        <div class="chip">步行</div>
      </div>

      <div class="card" style="margin-top:16px;padding:16px 18px">
        <div class="row" style="justify-content:space-between">
          <div class="label">9月总览</div>
          <div class="caption" style="font-size:12px;color:var(--acc)">共 12 次</div>
        </div>
        <div class="row" style="margin-top:12px">
          <div style="flex:1">
            <div class="num" style="font-size:20px">68.4</div>
            <div class="label" style="margin-top:2px">总距离 km</div>
          </div>
          <div style="flex:1">
            <div class="num" style="font-size:20px">9.2</div>
            <div class="label" style="margin-top:2px">总时长 h</div>
          </div>
          <div style="flex:1">
            <div class="num" style="font-size:20px;color:var(--orange)">4,180</div>
            <div class="label" style="margin-top:2px">总千卡</div>
          </div>
        </div>
      </div>

      <div class="label" style="margin-top:20px;margin-bottom:10px">今天</div>

      <div class="card" style="padding:14px;display:flex;gap:14px;align-items:center">
        <div style="width:74px;height:74px;border-radius:16px;overflow:hidden;position:relative;flex-shrink:0;background:var(--card-2)">
          <div class="map-sim" style="position:absolute;inset:0">
            <svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 74 74">
              <path d="M12 60 Q 28 50 34 38 T 52 18 T 64 10" fill="none" stroke="#C8F31D" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div style="flex:1">
          <div class="row" style="gap:8px">
            <span class="pill-tag" style="background:var(--acc-soft);color:var(--acc)">跑步</span>
            <span class="caption" style="font-size:11px;color:var(--txt-3)">07:12</span>
          </div>
          <div class="num" style="font-size:18px;margin-top:6px">5.23 km</div>
          <div class="caption" style="font-size:11px;margin-top:2px">32:41 · 6'15"/km · 312 kcal</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7480" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>

      <div class="card" style="padding:14px;display:flex;gap:14px;align-items:center;margin-top:10px">
        <div style="width:74px;height:74px;border-radius:16px;overflow:hidden;position:relative;flex-shrink:0;background:var(--card-2)">
          <div class="map-sim" style="position:absolute;inset:0">
            <svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 74 74">
              <path d="M8 52 Q 30 58 44 44 T 60 16" fill="none" stroke="#5BC8F5" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div style="flex:1">
          <div class="row" style="gap:8px">
            <span class="pill-tag" style="background:rgba(91,200,245,.14);color:var(--blue)">骑行</span>
            <span class="caption" style="font-size:11px;color:var(--txt-3)">昨天 18:40</span>
          </div>
          <div class="num" style="font-size:18px;margin-top:6px">18.6 km</div>
          <div class="caption" style="font-size:11px;margin-top:2px">52:10 · 21.4 km/h · 486 kcal</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7480" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>

      <div class="label" style="margin-top:18px;margin-bottom:10px">8月30日 周六</div>

      <div class="card" style="padding:14px;display:flex;gap:14px;align-items:center">
        <div style="width:74px;height:74px;border-radius:16px;overflow:hidden;position:relative;flex-shrink:0;background:var(--card-2)">
          <div class="map-sim" style="position:absolute;inset:0">
            <svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 74 74">
              <path d="M14 62 Q 22 44 38 40 T 58 12" fill="none" stroke="#FF8A5B" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div style="flex:1">
          <div class="row" style="gap:8px">
            <span class="pill-tag" style="background:rgba(255,138,91,.14);color:var(--orange)">步行</span>
            <span class="caption" style="font-size:11px;color:var(--txt-3)">20:05</span>
          </div>
          <div class="num" style="font-size:18px;margin-top:6px">3.1 km</div>
          <div class="caption" style="font-size:11px;margin-top:2px">41:20 · 4,120 步 · 158 kcal</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7480" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>

    <div style="flex:1"></div>
    <div class="tabbar">
      <div class="tab on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
        运动
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11m11-11v11M3 9v6m18-6v6M6.5 12h11"/></svg>
        跟练
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
        我的
      </div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
</body>
</html>
