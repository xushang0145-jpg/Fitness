<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 · 跑步进行中</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen">
  <div class="notch"></div>
  <div class="scroll">
    <div class="map-sim">
      <div class="map-park" style="left:-40px;top:90px;width:180px;height:150px"></div>
      <div class="map-water" style="right:-70px;top:340px;width:220px;height:220px"></div>
      <div class="map-road" style="left:0;top:240px;width:375px;height:14px;transform:rotate(-4deg)"></div>
      <div class="map-road" style="left:120px;top:0;width:12px;height:460px;transform:rotate(8deg)"></div>
      <div class="map-road" style="left:0;top:420px;width:375px;height:10px;transform:rotate(6deg)"></div>

      <svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 375 560" preserveAspectRatio="none">
        <path class="track-line" d="M60 500 Q 120 470 150 430 T 190 340 Q 200 300 160 280 T 110 210 Q 100 170 150 150 T 240 110"/>
      </svg>

      <div style="position:absolute;left:231px;top:96px;transform:translate(-50%,-50%)">
        <div style="width:44px;height:44px;border-radius:50%;background:rgba(200,243,29,.18);display:flex;align-items:center;justify-content:center;animation:none">
          <div style="width:16px;height:16px;border-radius:50%;background:var(--acc);border:3px solid #0B0D0E;box-shadow:0 0 12px rgba(200,243,29,.8)"></div>
        </div>
      </div>
      <div style="position:absolute;left:60px;top:500px;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--card-2);border:2px solid var(--acc);display:flex;align-items:center;justify-content:center">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="var(--acc)"><path d="M6 4l14 8-14 8z"/></svg>
      </div>

      <div class="statusbar" style="position:absolute;top:0;left:0;right:0"><span>9:41</span>
        <span style="display:flex;gap:6px;align-items:center">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="white"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke="white" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="white"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="white" opacity=".4"/></svg>
        </span>
      </div>

      <div style="position:absolute;top:64px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center">
        <div class="chip" style="background:rgba(24,28,34,.85);backdrop-filter:blur(10px)">
          <div style="width:7px;height:7px;border-radius:50%;background:var(--acc)"></div>
          GPS 信号强
        </div>
        <div class="chip" style="background:rgba(24,28,34,.85);backdrop-filter:blur(10px)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
          跑步中
        </div>
      </div>

      <div style="position:absolute;left:16px;right:16px;bottom:24px">
        <div style="background:rgba(20,23,28,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:28px;padding:22px 22px 18px">
          <div style="text-align:center">
            <div class="label">运动时长</div>
            <div class="num" style="font-size:52px;letter-spacing:-.03em;margin-top:2px">32:41</div>
          </div>
          <div class="row" style="margin-top:14px">
            <div style="flex:1;text-align:center">
              <div class="num" style="font-size:24px">5.23</div>
              <div class="label" style="margin-top:3px">距离 km</div>
            </div>
            <div style="width:1px;height:38px;background:var(--border)"></div>
            <div style="flex:1;text-align:center">
              <div class="num" style="font-size:24px">6'15"</div>
              <div class="label" style="margin-top:3px">平均配速</div>
            </div>
            <div style="width:1px;height:38px;background:var(--border)"></div>
            <div style="flex:1;text-align:center">
              <div class="num" style="font-size:24px;color:var(--orange)">312</div>
              <div class="label" style="margin-top:3px">千卡</div>
            </div>
          </div>
          <div class="row" style="justify-content:center;gap:20px;margin-top:20px">
            <div style="width:58px;height:58px;border-radius:50%;background:var(--card-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#F2F4F6"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>
            </div>
            <div style="width:78px;height:78px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(200,243,29,.35)">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="#0B0D0E"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
            </div>
            <div style="width:58px;height:58px;border-radius:50%;background:var(--card-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4F6" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            </div>
          </div>
          <div class="row" style="justify-content:center;gap:52px;margin-top:8px">
            <span class="label">暂停</span><span class="label" style="margin:0 -14px">结束</span><span class="label">锁屏</span>
          </div>
        </div>
      </div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
</body>
</html>
