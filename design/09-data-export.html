<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>09 · 数据导出</title>
<link rel="stylesheet" href="styles.css">
<style>
  .export-card{padding:18px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--border);margin-top:14px}
  .export-card .row{justify-content:space-between}
  .export-title{font-size:16px;font-weight:700}
  .export-desc{font-size:12px;color:var(--txt-2);margin-top:6px;line-height:1.5}
  .export-tag{font-size:11px;padding:4px 9px;border-radius:7px;background:var(--card-2);color:var(--txt-2);margin-top:10px;display:inline-block}
  .btn-sm{height:34px;padding:0 18px;border-radius:999px;background:var(--acc);color:#0B0D0E;font-size:13px;font-weight:700}
  .info-card{padding:14px 16px;border-radius:var(--r-md);background:var(--acc-soft);border:1px solid rgba(200,243,29,.25);margin-top:14px}
  .info-card .caption{color:var(--txt);line-height:1.5}
</style>
</head>
<body>
<div class="screen">
  <div class="notch"></div>
  <div class="scroll">
    <div class="statusbar"><span>9:41</span>
      <span style="display:flex;gap:6px;align-items:center">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="white"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke="white" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="white"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="white" opacity=".4"/></svg>
      </span>
    </div>

    <div style="padding:8px 20px 24px">
      <div class="row" style="gap:12px;align-items:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <div class="page-title">数据导出</div>
      </div>

      <div class="info-card">
        <div class="caption" style="font-size:13px">
          你的运动记录仅存储在本机。导出后可将文件保存到「文件」App，或通过微信 / 邮件发送给第三方应用。
        </div>
      </div>

      <div class="export-card">
        <div class="row">
          <div>
            <div class="export-title">导出 GPX 轨迹</div>
            <div class="export-desc">包含全部运动的完整 GPS 轨迹点，可导入 Keep、Strava、高德等应用。</div>
            <div class="export-tag">.gpx · 标准格式</div>
          </div>
          <button class="btn-sm">导出</button>
        </div>
      </div>

      <div class="export-card">
        <div class="row">
          <div>
            <div class="export-title">导出 CSV 汇总</div>
            <div class="export-desc">按日期倒序的每次运动统计，可用 Excel / Numbers 打开分析。</div>
            <div class="export-tag">.csv · UTF-8 BOM</div>
          </div>
          <button class="btn-sm">导出</button>
        </div>
      </div>

      <div class="caption" style="text-align:center;font-size:11px;color:var(--txt-3);margin-top:20px">
        数据不会上传任何服务器 · 文件生成后调用系统分享面板
      </div>
    </div>

    <div style="flex:1"></div>
  </div>
  <div class="homebar"></div>
</div>
</body>
</html>
