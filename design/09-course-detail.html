<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>09 · 课程详情</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen">
  <div class="notch"></div>
  <div class="scroll">
    <div style="position:relative;height:260px;flex-shrink:0">
      <img class="demo-img" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=fit%20athletic%20asian%20woman%20doing%20full%20body%20HIIT%20workout%2C%20high%20knees%20movement%2C%20dark%20modern%20gym%2C%20dramatic%20rim%20lighting%2C%20realistic%20fitness%20photography%2C%20moody%20dark%20tones&image_size=portrait_4_3" alt="">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,15,18,.45) 0%,transparent 30%,transparent 50%,var(--bg) 100%)"></div>
      <div class="statusbar" style="position:absolute;top:0;left:0;right:0"><span>9:41</span>
        <span style="display:flex;gap:6px;align-items:center">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="white"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke="white" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="white"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="white" opacity=".4"/></svg>
        </span>
      </div>
      <div style="position:absolute;top:64px;left:20px;right:20px;display:flex;justify-content:space-between">
        <div style="width:36px;height:36px;border-radius:12px;background:rgba(24,28,34,.7);backdrop-filter:blur(10px);border:1px solid var(--border);display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F4F6" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
      </div>
    </div>

    <div style="padding:0 20px;margin-top:-20px;position:relative;flex:1;overflow:hidden">
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <span class="pill-tag" style="background:rgba(255,91,106,.12);color:var(--red)">燃脂</span>
        <span class="pill-tag" style="background:var(--card-2);color:var(--txt-2);border:1px solid var(--border)">初级</span>
        <span class="pill-tag" style="background:var(--card-2);color:var(--txt-2);border:1px solid var(--border)">无器械</span>
      </div>
      <div class="page-title" style="font-size:26px;margin-top:10px">燃脂全身 · 20 分钟</div>
      <div class="caption" style="margin-top:4px;font-size:13px">8 个动作 · 全程站立 · 适合碎片时间高效燃脂</div>

      <div class="row" style="gap:10px;margin-top:16px">
        <div class="card" style="flex:1;padding:12px;text-align:center">
          <div class="num" style="font-size:18px">20<span style="font-size:11px;color:var(--txt-3)">min</span></div>
          <div class="label" style="margin-top:2px">预计时长</div>
        </div>
        <div class="card" style="flex:1;padding:12px;text-align:center">
          <div class="num" style="font-size:18px">~180</div>
          <div class="label" style="margin-top:2px">千卡</div>
        </div>
        <div class="card" style="flex:1;padding:12px;text-align:center">
          <div class="num" style="font-size:18px">8</div>
          <div class="label" style="margin-top:2px">动作</div>
        </div>
        <div class="card" style="flex:1;padding:12px;text-align:center">
          <div class="num" style="font-size:18px">无</div>
          <div class="label" style="margin-top:2px">器械</div>
        </div>
      </div>

      <div class="section-title" style="margin-top:22px">课程简介</div>
      <div class="caption" style="margin-top:8px;line-height:1.6">通过 8 个全身性动作循环训练，在 20 分钟内提升心率、燃烧热量。每个动作配有标准示意图和常见错误提示，新手也能安全跟练。</div>

      <div class="section-title" style="margin-top:22px">动作列表</div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
        <div class="card" style="padding:12px;display:flex;align-items:center;gap:12px">
          <div style="width:52px;height:52px;border-radius:14px;overflow:hidden;flex-shrink:0">
            <img class="demo-img" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=athletic%20person%20doing%20jumping%20jacks%2C%20dark%20gym%2C%20realistic%20fitness%20photography%2C%20dramatic%20lighting&image_size=square" alt="">
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:700">开合跳</div>
            <div class="caption" style="font-size:12px;margin-top:2px">热身 · 30 秒</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div class="card" style="padding:12px;display:flex;align-items:center;gap:12px">
          <div style="width:52px;height:52px;border-radius:14px;overflow:hidden;flex-shrink:0">
            <img class="demo-img" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=athletic%20person%20doing%20high%20knees%20running%20exercise%2C%20dark%20gym%2C%20realistic%20fitness%20photography%2C%20dramatic%20lighting&image_size=square" alt="">
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:700">高抬腿</div>
            <div class="caption" style="font-size:12px;margin-top:2px">燃脂 · 30 秒</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div class="card" style="padding:12px;display:flex;align-items:center;gap:12px">
          <div style="width:52px;height:52px;border-radius:14px;overflow:hidden;flex-shrink:0">
            <img class="demo-img" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=athletic%20person%20doing%20bodyweight%20squats%2C%20dark%20gym%2C%20realistic%20fitness%20photography%2C%20dramatic%20lighting&image_size=square" alt="">
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:700">徒手深蹲</div>
            <div class="caption" style="font-size:12px;margin-top:2px">臀腿 · 20 次</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div class="card" style="padding:12px;display:flex;align-items:center;gap:12px;opacity:.7">
          <div style="width:52px;height:52px;border-radius:14px;overflow:hidden;flex-shrink:0;background:var(--card-2);display:flex;align-items:center;justify-content:center;color:var(--txt-3);font-size:12px">休息</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:700">组间休息</div>
            <div class="caption" style="font-size:12px;margin-top:2px">放松 · 30 秒</div>
          </div>
        </div>
      </div>

      <div style="height:100px"></div>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 20px 26px;background:linear-gradient(0deg,var(--bg) 70%,transparent);z-index:30">
      <div class="btn-acc" style="height:54px;font-size:16px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#0B0D0E"><path d="M7 4l13 8-13 8z"/></svg>
        开始跟练
      </div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
</body>
</html>
