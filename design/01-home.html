<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 · 运动首页</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen">
  <div class="notch"></div>
  <div class="scroll">
    <div class="statusbar"><span>9:41</span>
      <span style="display:flex;gap:6px;align-items:center">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="white"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke="white" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="white"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="white" opacity=".4"/></svg>
      </span>
    </div>

    <div style="padding:8px 20px 0;overflow:hidden">
      <div class="row" style="justify-content:space-between">
        <div>
          <div class="caption">早上好，Alex</div>
          <div class="page-title" style="margin-top:4px">今天动起来</div>
        </div>
        <div class="avatar" style="width:46px;height:46px">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=portrait%20photo%20of%20a%20young%20asian%20man%20athlete%2C%20short%20black%20hair%2C%20wearing%20black%20sportswear%2C%20confident%20smile%2C%20studio%20lighting%2C%20dark%20background%2C%20headshot&image_size=square" alt="">
        </div>
      </div>

      <div class="card" style="margin-top:20px;padding:16px;display:flex;align-items:center;gap:14px">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <circle class="ring-track" cx="36" cy="36" r="30" stroke-width="8"/>
          <circle class="ring-acc" cx="36" cy="36" r="30" stroke-width="8"
            stroke-dasharray="188.5" stroke-dashoffset="68" transform="rotate(-90 36 36)"/>
          <text x="36" y="34" text-anchor="middle" fill="#F2F4F6" font-size="15" font-weight="700">64%</text>
          <text x="36" y="48" text-anchor="middle" fill="#6B7480" font-size="8">本周目标</text>
        </svg>
        <div style="flex:1">
          <div class="label">本周已完成</div>
          <div class="num" style="font-size:22px;margin-top:3px">18.6 <span style="font-size:12px;color:var(--txt-3);font-weight:500">/ 30 km</span></div>
          <div class="caption" style="margin-top:6px;font-size:12px">还差 2 次跑步达成周目标</div>
        </div>
      </div>

      <div class="row" style="gap:10px;margin-top:20px">
        <div class="card" style="flex:1;padding:14px;display:flex;align-items:center;gap:12px">
          <div style="width:38px;height:38px;border-radius:12px;background:rgba(91,200,245,.14);display:flex;align-items:center;justify-content:center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5BC8F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
          </div>
          <div>
            <div class="num" style="font-size:15px">7,842</div>
            <div class="label" style="margin-top:2px">今日步数</div>
          </div>
        </div>
        <div class="card" style="flex:1;padding:14px;display:flex;align-items:center;gap:12px">
          <div style="width:38px;height:38px;border-radius:12px;background:rgba(255,138,91,.14);display:flex;align-items:center;justify-content:center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8A5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          </div>
          <div>
            <div class="num" style="font-size:15px">420 <span style="font-size:11px;color:var(--txt-3)">kcal</span></div>
            <div class="label" style="margin-top:2px">今日消耗</div>
          </div>
        </div>
      </div>

      <div class="row" style="justify-content:space-between;margin-top:26px">
        <div class="section-title">开始运动</div>
        <div class="caption" style="font-size:12px;color:var(--txt-3)">选择类型</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">
        <div class="card" style="padding:0;overflow:hidden;position:relative;height:118px;border-color:rgba(200,243,29,.35)">
          <img class="demo-img" style="position:absolute;inset:0;opacity:.85" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=athletic%20asian%20man%20running%20outdoors%20at%20dusk%2C%20dynamic%20side%20view%2C%20wearing%20neon%20green%20and%20black%20sportswear%2C%20city%20park%20blurred%20background%2C%20dramatic%20moody%20lighting%2C%20sports%20photography&image_size=landscape_16_9" alt="">
          <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,15,18,.92) 25%,rgba(13,15,18,.15) 75%)"></div>
          <div style="position:relative;padding:18px;display:flex;flex-direction:column;justify-content:center;height:100%">
            <div class="pill-tag" style="background:var(--acc);color:#0B0D0E;width:fit-content">最常用</div>
            <div style="font-size:20px;font-weight:800;margin-top:8px">户外跑步</div>
            <div class="caption" style="font-size:12px;margin-top:2px">记录配速 · 轨迹 · 卡路里</div>
          </div>
        </div>

        <div class="card" style="padding:0;overflow:hidden;position:relative;height:96px">
          <img class="demo-img" style="position:absolute;inset:0;opacity:.85" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cyclist%20riding%20road%20bike%20on%20riverside%20road%20at%20sunset%2C%20dynamic%20low%20angle%2C%20aerodynamic%20helmet%2C%20cinematic%20dark%20tones%2C%20motion%20blur%20background&image_size=landscape_16_9" alt="">
          <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,15,18,.92) 25%,rgba(13,15,18,.15) 75%)"></div>
          <div style="position:relative;padding:18px;display:flex;flex-direction:column;justify-content:center;height:100%">
            <div style="font-size:19px;font-weight:800">户外骑行</div>
            <div class="caption" style="font-size:12px;margin-top:2px">速度 · 爬升 · 距离</div>
          </div>
        </div>

        <div class="card" style="padding:0;overflow:hidden;position:relative;height:96px">
          <img class="demo-img" style="position:absolute;inset:0;opacity:.85" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=person%20walking%20in%20morning%20park%20with%20sunlight%20through%20trees%2C%20casual%20athleisure%20outfit%2C%20healthy%20lifestyle%2C%20cinematic%20dark%20tones&image_size=landscape_16_9" alt="">
          <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,15,18,.92) 25%,rgba(13,15,18,.15) 75%)"></div>
          <div style="position:relative;padding:18px;display:flex;flex-direction:column;justify-content:center;height:100%">
            <div style="font-size:19px;font-weight:800">健步走</div>
            <div class="caption" style="font-size:12px;margin-top:2px">步数 · 时长 · 轻松记录</div>
          </div>
        </div>
      </div>
    </div>

    <div style="flex:1"></div>
    <div class="tabbar">
      <div class="tab on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
        运动
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11m11-11v11M3 9v6m18-6v6M6.5 12h11"/></svg>
        跟练
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
        我的
      </div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
</body>
</html>
